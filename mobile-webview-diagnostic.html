<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pocket Ledger WebView Diagnostic</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #fff; color: #111; }
    body { font-family: Arial, sans-serif; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #555; }
    label { display: block; margin: 16px 0 6px; font-size: 14px; }
    input { display: block; width: 100%; max-width: 500px; box-sizing: border-box; height: 48px; padding: 10px 12px; border: 1px solid #888; border-radius: 6px; font-size: 18px; background: #fff; color: #111; }
    #status { margin-top: 24px; padding: 12px; background: #f1f1f1; border-radius: 6px; white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>
  <h1>WebView Keyboard Diagnostic</h1>
  <p>Type in each field. If the page freezes when the keyboard opens, the issue is below the Pocket Ledger React UI.</p>

  <label for="name">Name</label>
  <input id="name" type="text" autocomplete="name" />

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" />

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="new-password" />

  <div id="status">JavaScript heartbeat starting...</div>

  <script>
    const status = document.getElementById('status');
    let ticks = 0;
    setInterval(() => {
      ticks += 1;
      status.textContent = `JavaScript alive\nHeartbeat: ${ticks}\nActive element: ${document.activeElement?.id || document.activeElement?.tagName || 'none'}\nName value: ${document.getElementById('name').value}`;
    }, 1000);
  </script>
</body>
</html>
