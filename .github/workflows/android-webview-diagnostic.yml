name: Android WebView Keyboard Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build mobile web assets
        run: npm run build:mobile

      - name: Replace app entry with minimal WebView diagnostic
        run: cp mobile-webview-diagnostic.html dist/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Enable WebView remote debugging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('capacitor.config.ts')
          text = p.read_text()
          text = text.replace('webContentsDebuggingEnabled: false', 'webContentsDebuggingEnabled: true')
          p.write_text(text)
          PY
          npx cap copy android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build diagnostic APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ledger-webview-keyboard-diagnostic
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
