name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type to build"
        type: choice
        options: [debug, release-unsigned]
        default: debug

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 1

      - name: Verify source revision
        run: |
          echo "Building commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current)"
          test "$(git branch --show-current)" = "main"
          if grep -R -n -E 'New laptop|What are you saving for\?|placeholder=[\"'\''`]70000[\"'\''`]' src --exclude-dir=node_modules; then
            echo "::error::Old Saving Goal placeholders are still present in source."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure backend env vars
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if grep -q "VITE_SUPABASE_URL" .env 2>/dev/null; then
            echo "Using committed .env"
          elif [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            printf 'VITE_SUPABASE_URL="%s"\nVITE_SUPABASE_PUBLISHABLE_KEY="%s"\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_PUBLISHABLE_KEY" > .env
          else
            echo "::error::No backend credentials found (.env missing and repo secrets not set)."
            exit 1
          fi

      - name: Build mobile web assets
        run: npm run build:mobile

      - name: Verify web build output
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -R -n -E 'New laptop|What are you saving for\?|70000' dist; then
            echo "::error::Old Saving Goal UI was emitted into the mobile web build."
            exit 1
          fi
          echo "Saving Goal UI verification passed."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify synced Android web assets
        run: |
          if grep -R -n -E 'New laptop|What are you saving for\?|70000' android/app/src/main/assets/public; then
            echo "::error::Old Saving Goal UI was copied into Android assets."
            exit 1
          fi
          echo "Android asset verification passed."

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          if [ "${{ inputs.build_type }}" = "release-unsigned" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ledger-apk-${{ inputs.build_type || 'debug' }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
