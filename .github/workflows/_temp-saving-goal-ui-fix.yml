name: Temporary saving goal UI fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temp-saving-goal-ui-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: saving goal form UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Update saving goal form
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/_shell.more.saving-goals.tsx')
          s = p.read_text()
          s = s.replace('import { Select, SelectContent, SelectItem, SelectTrigger, SelectValue } from "@/components/ui/select";\n', '')
          s = s.replace('const DEFAULT_ICON = "piggy-bank";\n', '')
          s = s.replace('const [icon, setIcon] = useState(DEFAULT_ICON); const [color, setColor] = useState(ICON_COLORS[0]);', 'const [icon, setIcon] = useState(""); const [color, setColor] = useState("");')
          s = s.replace('setIcon(existing?.icon ?? DEFAULT_ICON); setColor(existing?.color ?? ICON_COLORS[0]);', 'setIcon(existing?.icon ?? ""); setColor(existing?.color ?? "");')
          old = '<div className="space-y-1.5"><Label className="text-xs">Icon</Label><Select value={icon} onValueChange={setIcon}><SelectTrigger className="h-12 rounded-xl"><SelectValue /></SelectTrigger><SelectContent>{ICON_OPTIONS.map((option) => <SelectItem key={option} value={option} className="capitalize">{option.replaceAll("-", " ")}</SelectItem>)}</SelectContent></Select></div>'
          new = '<div className="space-y-1.5"><Label className="text-xs">Icon</Label><div className="no-scrollbar flex flex-wrap gap-2 overflow-y-auto pb-1">{ICON_OPTIONS.map((i) => <button type="button" key={i} onClick={() => setIcon(i)} className={`grid size-10 shrink-0 place-items-center rounded-xl ${icon === i ? "bg-primary text-primary-foreground" : "bg-secondary"}`} aria-label={`Use ${i.replaceAll("-", " ")} icon`}><AppIcon name={i} className="size-4" /></button>)}</div></div>'
          if old not in s:
              raise SystemExit('icon selector block not found')
          s = s.replace(old, new)
          s = s.replace('icon, color, description: description.trim()', '...(icon ? { icon } : {}), ...(color ? { color } : {}), description: description.trim()')
          p.write_text(s)

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_shell.more.saving-goals.tsx
          git commit -m 'fix: saving goal form UI'
          git push origin main
          rm -f .github/workflows/_temp-saving-goal-ui-fix.yml
          git add .github/workflows/_temp-saving-goal-ui-fix.yml
          git commit -m 'chore: remove temporary UI fix workflow'
          git push origin main
